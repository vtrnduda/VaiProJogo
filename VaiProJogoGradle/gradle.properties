# Configurações do Gradle
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Configurações de rede
systemProp.http.keepAlive=true
systemProp.http.maxConnections=10
systemProp.http.maxConnectionsPerRoute=5

# Configurações SSL/TLS
systemProp.https.protocols=TLSv1.2
systemProp.jsse.enableSNIExtension=false

# Configurações JVM para conectividade
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2 